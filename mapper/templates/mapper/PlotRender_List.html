{% extends "home/base.html" %}
{% load static %}
{% load humanize %}
{% block addon_css %}
<link rel="stylesheet" href="{% static 'home/css/nv.d3.min.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/nvd3-update.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/Spectrum_1_8_1.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/select2_4.1.0-rc.0._full.css' %}" type="text/css">

<style>
    #ListPlot {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Or center if you want vertical centering too */
      width: 100%;
    }

    #ListPlot svg {
      display: block;
    }
</style>
{% endblock %}

{% block content %}
<div style="padding-top: 10px; font-size: 11px; white-space: nowrap;">
  <div class="col-md-12" style="margin-top: 30px;">
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center;">

      <!-- Receptor names dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="receptorLabelDropdown" data-toggle="dropdown">
          Receptor names
        </button>
        <div class="dropdown-menu p-2 text-center"
            style="min-width: 160px; padding: 10px 15px; left: 100%; top: 50%;
                    margin-left: 5px; position: absolute; transform: translateY(-50%);">

          <button class="btn btn-primary btn-block mb-1 receptor-label-btn" data-value="Protein" id="List_IUPHARNames">Protein</button>
          <button class="btn btn-outline-primary btn-block mb-1 receptor-label-btn" data-value="Gene" id="List_GeneNames">Gene</button>
          <button class="btn btn-outline-primary btn-block receptor-label-btn" data-value="UniProt" id="List_UniProtNames">UniProt</button>
        </div>
      </div>

      <!-- Layout Dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="layoutDropdown" data-toggle="dropdown">
          Layout
        </button>
        <div class="dropdown-menu p-3 text-center"
            style="min-width: 250px; padding: 10px 15px; left: 100%; top: 50%;
                    margin-left: 5px; position: absolute; transform: translateY(-25%);">

          <!-- Row 1: Layout selection -->
          <div class="mb-3" style="padding: 10px 15px;">
            <label for="List_Layout_Column_Selector" style="padding: 5px 0px;">Layout:</label>
            <select id="List_Layout_Column_Selector" class="form-select" style="width:125px;text-align: center; padding: 5px;">
              <option value="1">1 column</option>
              <option value="2" selected>2 columns</option>
              <option value="3">3 columns</option>
              <option value="4">4 columns</option>
            </select>
          </div>

          <!-- Row 2: Label max count label -->
          <div class="mb-2" style="padding: 5px 15px;">
            <label for="Layout_Max_Label">Max label number per column:</label>
          </div>

          <!-- Row 3: Dropdown and numeric input -->
          <div class="d-flex justify-content-center align-items-center gap-2" style="padding: 0px 15px 10px;">
            <select id="Layout_Max_Label" class="form-select" style="width: 120px;padding: 5px;">
              <option value="Auto" selected>Auto</option>
              <option value="Custom">Custom</option>
            </select>
            <input type="number" id="List_Layout_Max_Label_input"
                  class="form-control"
                  style="width: 80px;"
                  min="1">
          </div>
          <!-- Row 4: -->
          <div class="mb-2" style="padding: 10px 15px;">
            <label>Visible labels:</label>
          </div>
          <div class="form-check mb-2" style="padding: 0px 15px;margin-top:-10px">
            <input class="form-check-input" type="checkbox" id="toggle-layer-1" checked>
            <label class="form-check-label" for="toggle-layer-1">Display class</label>
          </div>
          <div class="form-check mb-2" style="padding: 0px 15px;">
            <input class="form-check-input" type="checkbox" id="toggle-layer-2" checked>
            <label class="form-check-label" for="toggle-layer-2">Display ligand type</label>
          </div>
          <div class="form-check mb-2" style="padding: 0px 15px;">
            <input class="form-check-input" type="checkbox" id="toggle-layer-3" checked>
            <label class="form-check-label" for="toggle-layer-3">Display receptor family</label>
          </div>

        </div>
      </div>

      <!-- Label Styling Dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="Styling_Menu" data-toggle="dropdown">
          Labels
        </button>
        <div class="dropdown-menu p-3" style="min-width: 325px; padding: 10px 15px; left: 100%; top: 50%; margin-left: 5px; position: absolute; transform: translateY(-9%);">
          <!-- Class Section -->
          <div class="mb-4" style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Class</label>
            <!-- Row 1: Color picker + checkboxes -->
            <div style="white-space: nowrap;">
              <!-- Color Picker -->
              <input type="text" id="colorPicker_Class" style="display: inline-block; width: 90px; vertical-align: middle; margin-right: 15px;" />
              <!-- Bold -->
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0; margin-left: 10px;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="boldCheckbox_Class"> Bold
                </label>
              </div>
              <!-- Italic -->
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="italicCheckbox_Class"> Italic
                </label>
              </div>
              <!-- Underline -->
              <div class="checkbox" style="display: inline-block; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="underlineCheckbox_Class"> Underline
                </label>
              </div>
            </div>
            <!-- Label above slider -->
            <div class="text-center" style="margin-top: 10px;">
              <label class="form-label">Font size</label>
            </div>

            <!-- Slider -->
            <input type="range" class="form-control" min="8" max="32" id="fontSizeSlider_Class" style="width: 100%;">

            <!-- Value under slider -->
            <div class="text-center" style="margin-top: -5px;">
              <span id="fontSizeSliderLabel_Class">20 px</span>
            </div>
          </div>
          <!-- Ligand Type Section -->
          <div class="mb-4" style="margin-bottom: 20px;">
            <hr>
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Ligand type</label>
            <!-- Row 1: Color picker + checkboxes -->
            <div style="white-space: nowrap;">
              <input type="text" id="colorPicker_LigandType" style="display: inline-block; width: 90px; vertical-align: middle; margin-right: 15px;" />
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0; margin-left: 10px;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="boldCheckbox_LigandType"> Bold
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="italicCheckbox_LigandType"> Italic
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="underlineCheckbox_LigandType"> Underline
                </label>
              </div>
            </div>
            <!-- Label above slider -->
            <div class="text-center" style="margin-top: 10px;">
              <label class="form-label">Font size</label>
            </div>

            <!-- Slider -->
            <input type="range" class="form-control" min="8" max="28" id="fontSizeSlider_LigandType" style="width: 100%;">

            <!-- Value under slider -->
            <div class="text-center" style="margin-top: -5px;">
              <span id="fontSizeSliderLabel_LigandType">18 px</span>
            </div>
          </div>
          <!-- Receptor Family Section -->
          <div class="mb-4" style="margin-bottom: 20px;">
            <hr>
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Receptor family</label>
            <div style="white-space: nowrap;">
              <input type="text" id="colorPicker_ReceptorFamily" style="display: inline-block; width: 90px; vertical-align: middle; margin-right: 15px;" />
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0; margin-left: 10px;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="boldCheckbox_ReceptorFamily"> Bold
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="italicCheckbox_ReceptorFamily"> Italic
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="underlineCheckbox_ReceptorFamily"> Underline
                </label>
              </div>
            </div>
            <!-- Label above slider -->
            <div class="text-center" style="margin-top: 10px;">
              <label class="form-label">Font size</label>
            </div>

            <!-- Slider -->
            <input type="range" class="form-control" min="8" max="28" id="fontSizeSlider_ReceptorFamily" style="width: 100%;">

            <!-- Value under slider -->
            <div class="text-center" style="margin-top: -5px;">
              <span id="fontSizeSliderLabel_ReceptorFamily">16 px</span>
            </div>

          </div>
          <!-- Receptor Section -->
          <div class="mb-2" style="margin-bottom: 20px;">
            <hr>
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Receptor</label>
            <div style="white-space: nowrap;">
              <input type="text" id="colorPicker_Receptor" style="display: inline-block; width: 90px; vertical-align: middle; margin-right: 15px;" />
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0; margin-left: 10px;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="boldCheckbox_Receptor"> Bold
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-right: 15px; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="italicCheckbox_Receptor"> Italic
                </label>
              </div>
              <div class="checkbox" style="display: inline-block; margin-bottom: 0;">
                <label style="margin-bottom: 0;">
                  <input type="checkbox" id="underlineCheckbox_Receptor"> Underline
                </label>
              </div>
            </div>
            <!-- Label above slider -->
            <div class="text-center" style="margin-top: 10px;">
              <label class="form-label">Font size</label>
            </div>

            <!-- Slider -->
            <input type="range" class="form-control" min="8" max="26" id="fontSizeSlider_Receptor" style="width: 100%;">

            <!-- Value under slider -->
            <div class="text-center" style="margin-top: -5px;">
              <span id="fontSizeSliderLabel_Receptor">14 px</span>
            </div>

          </div>
        </div>
      </div>

      <!-- Color Styling Dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="Styling_Menu" data-toggle="dropdown">
          Colors
        </button>
        <div class="dropdown-menu p-3" style="min-width: 525px; padding: 10px 15px; left: 100%; top: 50%; margin-left: 5px; position: absolute; transform: translateY(-25%);">
          <div id="colorStylingContainer"></div>
        </div>
      </div>

      <!-- Legend Labels Dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="LegendLabelMenu" data-toggle="dropdown">
          Legend
        </button>
        <div class="dropdown-menu p-3"
            style="min-width: 400px; padding: 10px 15px; left: 100%; top: 50%;
                    margin-left: 5px; position: absolute; transform: translateY(-25%);">
          <div id="legendLabelContainer"></div>
        </div>
      </div>

      <!-- Download Dropdown -->
      <div class="dropdown" style="position: relative;">
        <button type="button" class="btn btn-primary dropdown-toggle"
                id="DownloadDropdownToggle" style="font-size: 14px;">
          <span class="glyphicon glyphicon-download" style="vertical-align: top; line-height: 1.3;"></span>
          Download <span class="caret"></span>
        </button>

        <div class="dropdown-menu text-center"
            style="min-width: 160px; padding: 10px 15px; left: 100%; top: 50%;
                    margin-left: 5px; position: absolute; transform: translateY(-40%);
                    display: none; z-index: 999;">
          <button type="button" class="btn btn-primary btn-block mb-1"
                  onclick="saveSvgAsJpg(document.getElementById('ListPlot_visualization'), 'Listplot.jpg');">JPG</button>
          <button type="button" class="btn btn-primary btn-block mb-1"
                  onclick="saveSvgAsPng(document.getElementById('ListPlot_visualization'), 'Listplot.png');">PNG</button>
          <button type="button" class="btn btn-primary btn-block mb-1"
                  onclick="saveSvg(document.getElementById('ListPlot_visualization'), 'Listplot.svg');">SVG</button>
          <button type="button" class="btn btn-primary btn-block"
                  onclick="saveSvgAsTiff(document.getElementById('ListPlot_visualization'), 'Listplot.tiff');">TIFF</button>
        </div>
      </div>
      <div>
        <a href="/mapper/DataMapperHomeNumeric" class="btn btn-primary" style="display: inline-flex; align-items: center;">
          <span style="line-height: 1; margin-right: 6px; vertical-align: middle;">&#8592;</span>
          <span style="vertical-align: middle;">Return to plot selection</span>
        </a>
      </div>
    </div>
  </div>
  <!-- === List plot container === -->
  <div id="ListPlot" class="text-left" style="margin-top: 120px; margin-left: 150px;"></div>
</div>
{% endblock %}

{% block addon_js %}
<script src="{% static 'home/js/d3.min.js' %}"></script>
<script src="{% static 'home/js/nv.d3.min.js' %}"></script>
<script src="{% static 'home/js/d3.v4.min.js' %}"></script>
<script src="{% static 'home/js/saveSvgAsPng.js' %}"></script>
<script src="{% static 'home/js/saveSvg.js' %}"></script>
<script src="{% static 'home/js/datamapper.js' %}"></script>
<script src="{% static 'home/js/spectrum_v1_8_1.js' %}"></script>
<script src="{% static 'home/js/select2_4.1.0-rc.0_full.js' %}"></script>

<!-- Universal scripts -->
<script>
$('.dropdown-menu').on('click', function(event){
    event.stopPropagation();
});
</script>
<script>
$(document).ready(function() {
  // Function to initialize Spectrum color picker
  function initialize_List_Styling_ColorPicker(elementId, start_color, layer) {
      $("#" + elementId).spectrum({
          color: start_color,
          showPalette: true,
          showInput: true,
          preferredFormat: "hex",
          palette: [
              ["#000", "#FF0000", "#00FF00", "#0000FF", "#FFFF00"],
              ["#FF00FF", "#00FFFF", "#FFFFFF", "#C0C0C0", "#808080"],
              ["#800000", "#808000", "#008000", "#800080", "#008080"],
              ["#000080"]
          ],
          change: function(color) {
              Styling_Option_dict[layer].Color = color.toHexString();
              updateVisualization_list();  // Re-render after final color selection
          },
          move: function(color) {
              Styling_Option_dict[layer].Color = color.toHexString();
              updateVisualization_list();  // Re-render after final color selection
          }
      });
  }

  // Initialize all color pickers
  initialize_List_Styling_ColorPicker('colorPicker_Class', Styling_Option_dict.Class.Color, 'Class');
  initialize_List_Styling_ColorPicker('colorPicker_LigandType', Styling_Option_dict.LigandType.Color, 'LigandType');
  initialize_List_Styling_ColorPicker('colorPicker_ReceptorFamily', Styling_Option_dict.ReceptorFamily.Color, 'ReceptorFamily');
  initialize_List_Styling_ColorPicker('colorPicker_Receptor', Styling_Option_dict.Receptor.Color, 'Receptor');
});
</script>
<script>

// #####################
// # Load view context #
// #####################

var listdata = {{ listplot_data|safe }};
var list_data_wow = {{ listplot_data_variables|safe }};
var Label_conversion_dicts = {{Label_Conversion|safe}};
var modded_list_data = Initialize_Data(listdata);
data_types_list = {'Col1':'Continuous', 'Col2':'Continuous', 'Col3':'Continuous', 'Col4':'Continuous'}

// #################################
// ## Initialize global variables ##
// #################################

// # Initialize layout #
var Layout_dict = {columns: 2, col_breaker: 'Custom', col_max_label: 'Auto', indentation: 'Yes'};

//  Initialize styling
var Styling_Option_dict = {
    Class: {Bold: true, Italic: false, Underline: false, Fontsize: "20px", Color: "#000"},
    LigandType: {Bold: false, Italic: false, Underline: false, Fontsize: "18px", Color: "#000"},
    ReceptorFamily: {Bold: false, Italic: false, Underline: false, Fontsize: "16px", Color: "#000"},
    Receptor: {Bold: false, Italic: false, Underline: false, Fontsize: "14px", Color: "#000"}};

// Initialize each section to match Styling_Option_dict
function initializeStyling() {
    // Class
    document.getElementById('boldCheckbox_Class').checked = Styling_Option_dict.Class.Bold;
    document.getElementById('italicCheckbox_Class').checked = Styling_Option_dict.Class.Italic;
    document.getElementById('underlineCheckbox_Class').checked = Styling_Option_dict.Class.Underline;
    document.getElementById('fontSizeSlider_Class').value = parseInt(Styling_Option_dict.Class.Fontsize);
    document.getElementById('colorPicker_Class').value = Styling_Option_dict.Class.Color;

    // LigandType
    document.getElementById('boldCheckbox_LigandType').checked = Styling_Option_dict.LigandType.Bold;
    document.getElementById('italicCheckbox_LigandType').checked = Styling_Option_dict.LigandType.Italic;
    document.getElementById('underlineCheckbox_LigandType').checked = Styling_Option_dict.LigandType.Underline;
    document.getElementById('fontSizeSlider_LigandType').value = parseInt(Styling_Option_dict.LigandType.Fontsize);
    document.getElementById('colorPicker_LigandType').value = Styling_Option_dict.LigandType.Color;

    // ReceptorFamily
    document.getElementById('boldCheckbox_ReceptorFamily').checked = Styling_Option_dict.ReceptorFamily.Bold;
    document.getElementById('italicCheckbox_ReceptorFamily').checked = Styling_Option_dict.ReceptorFamily.Italic;
    document.getElementById('underlineCheckbox_ReceptorFamily').checked = Styling_Option_dict.ReceptorFamily.Underline;
    document.getElementById('fontSizeSlider_ReceptorFamily').value = parseInt(Styling_Option_dict.ReceptorFamily.Fontsize);
    document.getElementById('colorPicker_ReceptorFamily').value = Styling_Option_dict.ReceptorFamily.Color;

    // Receptor
    document.getElementById('boldCheckbox_Receptor').checked = Styling_Option_dict.Receptor.Bold;
    document.getElementById('italicCheckbox_Receptor').checked = Styling_Option_dict.Receptor.Italic;
    document.getElementById('underlineCheckbox_Receptor').checked = Styling_Option_dict.Receptor.Underline;
    document.getElementById('fontSizeSlider_Receptor').value = parseInt(Styling_Option_dict.Receptor.Fontsize);
    document.getElementById('colorPicker_Receptor').value = Styling_Option_dict.Receptor.Color;
}

// # Initialize label switcher #
var Label_names = 'Protein';
var Barlabels = {'Col1':"Dataset 1",'Col2':"Dataset 2",'Col3':"Dataset 3",'Col4':"Dataset 4"}

// # Initialize data styling #
var Data_styling = initializeDataStyling(list_data_wow, data_types_list);
const List_Data_result = Data_resorter(modded_list_data);
var Data_array = List_Data_result.final_array;
var Data_Category_array = List_Data_result.category_array;

// #################################
// # Initialize data visualization #
// #################################

function Listplot_render_visualization(){
  const Col_break_number = Layout_dict.col_max_label === "Auto" ? Math.ceil(Data_array.length / Layout_dict.columns) : Layout_dict.Col_break_number;
  var layout_spacing = Calculate_dimension(Data_array, Data_Category_array, Col_break_number, Layout_dict.columns, Label_conversion_dicts, Label_names, Styling_Option_dict);
  RenderListPlot_Labels(Data_array,Data_Category_array, 'ListPlot',Styling_Option_dict,Layout_dict,Label_conversion_dicts,Label_names);
  data_visualization(Data_array, Data_Category_array, 'ListPlot', Layout_dict, Data_styling, layout_spacing,30,6,14,Barlabels);
}

document.addEventListener("DOMContentLoaded", function() {
  initializeStyling();
  Listplot_render_visualization();
});

// Function to update a label and redraw the legend
function updateLabel(category) {
  var inputId = "labelInput_" + category;
  var newValue = document.getElementById(inputId).value;

  // Update the Label_dict
  Barlabels[category] = newValue;

  // Now re-run your createLegendBars with updated labels
  updateVisualization_list();
}

function Recalculate_data_and_update() {
  // Recalculate the data
  const List_Data_result = Data_resorter(modded_list_data);

  // Update the previously declared variables with new values
  Data_array = List_Data_result.final_array; 
  Data_Category_array = List_Data_result.category_array;

  // Call the function to update the visualization
  UpdateLayout();
}

// Function to update the visualization
function updateVisualization_list() {
    // Clear existing SVG content
    d3.select("#ListPlot_visualization").remove();
    // Re-render the visualization
    Listplot_render_visualization();
    }

// Add event listeners to checkboxes
d3.selectAll('input[type="checkbox"]').on("change", Recalculate_data_and_update);

// #####################
// ## Layout options  ##
// #####################

// Function to update the layout dynamically
function UpdateLayout() {
  // Get values from dropdowns and input
  const Cols = parseInt(document.querySelector("#List_Layout_Column_Selector").value);
  const Max_label_selector = document.querySelector("#Layout_Max_Label").value;
  const Max_label_number = parseInt(document.querySelector("#List_Layout_Max_Label_input").value) || 1;

  // Handle Max label number
  if (Max_label_selector === 'Auto') {
      Layout_dict.col_max_label = 'Auto';
      Layout_dict.Col_break_number = Math.ceil(Data_array.length / Cols);
  } else if (Max_label_selector === 'Custom') {
      Layout_dict.col_max_label = 'Custom';
      Layout_dict.Col_break_number = Max_label_number;
  }

  // Update columns value
  Layout_dict.columns = Cols;

  // Update visualization dynamically
  updateVisualization_list();
}

// Event listeners for dropdown and input changes
document.querySelector('#List_Layout_Column_Selector').addEventListener('change', UpdateLayout);
document.querySelector('#Layout_Max_Label').addEventListener('change', UpdateLayout);
document.querySelector('#List_Layout_Max_Label_input').addEventListener('input', UpdateLayout);

// Optional: Add logic to enable/disable the input field if "Custom" is selected
document.querySelector('#Layout_Max_Label').addEventListener('change', function() {
const maxLabelInput = document.querySelector("#List_Layout_Max_Label_input");
if (this.value === 'Custom') {
    maxLabelInput.disabled = false;
} else {
    maxLabelInput.disabled = true;
}
});

// Initially disable the max label input if "Auto" is selected
if (document.querySelector("#Layout_Max_Label").value === 'Auto') {
document.querySelector("#List_Layout_Max_Label_input").disabled = true;
}

// #####################
// ## Styling options ##
// #####################

// Function to update the styles for each section dynamically
function updateLayerStyling(layer) {
  // Get the selected values for the current layer
  const boldCheckbox = document.getElementById(`boldCheckbox_${layer}`).checked;
  const italicCheckbox = document.getElementById(`italicCheckbox_${layer}`).checked;
  const underlineCheckbox = document.getElementById(`underlineCheckbox_${layer}`).checked;
  const fontSize = `${document.getElementById(`fontSizeSlider_${layer}`).value}px`;

  // Update the Styling_Option_dict with the selected values
  Styling_Option_dict[layer].Bold = boldCheckbox;
  Styling_Option_dict[layer].Italic = italicCheckbox;
  Styling_Option_dict[layer].Underline = underlineCheckbox;
  Styling_Option_dict[layer].Fontsize = fontSize;

  // Update the visualization with the new styles (replace with your visualization update logic)
  updateVisualization_list();
}

// Add event listeners to checkboxes and sliders for all layers
function addEventListeners() {
  ["Class", "LigandType", "ReceptorFamily", "Receptor"].forEach(layer => {
      // Add event listeners for checkboxes
      document.getElementById(`boldCheckbox_${layer}`).addEventListener("change", function() {
      updateLayerStyling(layer);
      });

      document.getElementById(`italicCheckbox_${layer}`).addEventListener("change", function() {
      updateLayerStyling(layer);
      });

      document.getElementById(`underlineCheckbox_${layer}`).addEventListener("change", function() {
      updateLayerStyling(layer);
      });

      // Add event listener for font size slider
      document.getElementById(`fontSizeSlider_${layer}`).addEventListener("input", function() {
      document.getElementById(`fontSizeSliderLabel_${layer}`).textContent = `${this.value} px`;
      updateLayerStyling(layer);
      });
  });
}

// Call this function to initialize everything once the DOM is ready
function initializeStylingOptions() {
  addEventListeners();
}

// Trigger initialization when the document is fully loaded
document.addEventListener("DOMContentLoaded", initializeStylingOptions);

// ###################
// ## Data styling ##
// ###################

function populateLegendLabelInputs(containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  // Header row
  const headerRow = document.createElement("div");
  headerRow.className = "row";
  headerRow.innerHTML = `
    <div class="col-md-3 text-left" style="margin-left: 10px;"><strong>Dataset</strong></div>
    <div class="col-md-8 text-left" style="margin-left: 10px; margin-bottom: 10px;"><strong>Gradient bar text</strong></div>
  `;
  container.appendChild(headerRow);

  // Add editable rows
  Object.keys(Data_styling).forEach(function (column) {
    if (Data_styling[column].Data === "Yes" && Data_styling[column].Datatype === 'Continuous') {
      const index = column.substr(3); // E.g., Col1 → 1

      const row = document.createElement("div");
      row.className = "row";
      row.style.marginBottom = "10px";

      row.innerHTML = `
        <div><hr style="margin: 0px 0px 10px 0px"></div>
        <div class="col-md-3 text-left" style="padding-top: 6px; margin-left: 10px;">
          Dataset ${index}
        </div>
        <div class="col-md-8" style="margin-left: 10px;">
          <input type="text" maxlength="25" class="form-control input-sm"
                 id="labelInput_${column}" value="${Barlabels[column]}"
                 oninput="updateLabel('${column}')">
        </div>
      `;

      container.appendChild(row);
    }
  });
}

function enhanceListPlotDropdownsWithSelect2(activeColumns) {
  const colorPresets = {
    One: { setup: "One", colorStart: "#ffffff", colorAvg: "#ffffff", colorEnd: "#707070" },
    Two: { setup: "Two", colorStart: "#97a6c4", colorAvg: "#ffffff", colorEnd: "#384860" },
    Three_RWB: { setup: "Three", colorStart: "#a00000", colorAvg: "#ffffff", colorEnd: "#1a80bb" },
    Three_TWM: { setup: "Three", colorStart: "#298c8c", colorAvg: "#ffffff", colorEnd: "#800074" }
  };

  activeColumns.forEach(column => {
    $(`#${column}_Style`).select2({
      templateResult: formatColorScheme,
      templateSelection: formatColorScheme,
      width: 'resolve'
    }).on('change', function () {
      const selected = this.value;
      const preset = colorPresets[selected];
      if (!preset) return;

      Data_styling[column].Data_color1 = preset.colorStart;
      Data_styling[column].Data_color2 = preset.colorEnd;
      Data_styling[column].data_color_complexity = preset.setup;

      const min = document.getElementById(`${column}_ColorPicker_min`).parentElement;
      const mid = document.getElementById(`${column}_ColorPicker_middle`).parentElement;
      const max = document.getElementById(`${column}_ColorPicker_max`).parentElement;

      min.style.visibility = preset.setup !== "One" ? "visible" : "hidden";
      mid.style.visibility = preset.setup === "Three" ? "visible" : "hidden";
      max.style.visibility = "visible";

      $(`#${column}_ColorPicker_min`).spectrum("set", preset.colorStart);
      $(`#${column}_ColorPicker_max`).spectrum("set", preset.colorEnd);

      updateVisualization_list();
    });
  });
}

function formatColorScheme(option) {
  if (!option.id) return option.text;
  const colorMap = {
    One: [null, null, "#707070"],
    Two: ["#97a6c4", null, "#384860"],
    Three_RWB: ["#a00000", "#ffffff", "#1a80bb"],
    Three_TWM: ["#298c8c", "#ffffff", "#800074"]
  };
  const colors = colorMap[option.id];
  if (!colors) return option.text;

  return $(`
    <span style="display: flex; align-items: center;">
      <span style="min-width: 50px; text-align: center; margin-right: 5px;">${option.text}</span>
      ${colors.map(c => `<span style="display:inline-block;width:12px;height:12px;margin-left:4px;border:1px solid #ccc;border-radius:2px;background:${c || 'transparent'};${c ? '' : 'opacity:0'}"></span>`).join('')}
    </span>
  `);
}

function populateLegendColorInputs(containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  // Header row
  const headerRow = `
    <div class="row" style="margin: 20px 0px 10px 0px;">
      <div class="col-md-2 text-center"><strong>Dataset</strong></div>
      <div class="col-md-4 text-center"><strong>Number of colors</strong></div>
      <div class="col-md-2 text-center"><strong>Min</strong></div>
      <div class="col-md-2 text-center"><strong>Mid</strong></div>
      <div class="col-md-2 text-center"><strong>Max</strong></div>
    </div>
    <div style="margin: -10px 0px -10px 0px;"><hr></div>
  `;
  container.insertAdjacentHTML("beforeend", headerRow);

  const activeColumns = [];

  Object.keys(Data_styling).forEach(function (column) {
    if (Data_styling[column].Data === "Yes" && Data_styling[column].Datatype === 'Continuous') {
      activeColumns.push(column);
      const index = column.substr(3);

      const currentStyle = Data_styling[column].data_color_complexity || "One";

      const rowHTML = `
        <div class="row" style="margin: 20px 0px 10px 0px;"">
          <div class="col-md-2 text-center">Dataset ${index}</div>
          <div class="col-md-4">
            <select id="${column}_Style" class="form-control input-sm">
              <option value="One">One</option>
              <option value="Two">Two</option>
              <option value="Three_RWB">Three</option>
              <option value="Three_TWM">Three</option>
            </select>
          </div>
          <div class="col-md-2">
            <input type="text" id="${column}_ColorPicker_min" class="form-control input-sm" placeholder="Min" />
          </div>
          <div class="col-md-2">
            <input type="text" id="${column}_ColorPicker_middle" class="form-control input-sm" placeholder="Mid" />
          </div>
          <div class="col-md-2">
            <input type="text" id="${column}_ColorPicker_max" class="form-control input-sm" placeholder="Max" />
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", rowHTML);

      // Initialize pickers
      initialize_ListPlot_ColorPicker(`${column}_ColorPicker_min`, Data_styling[column].Data_color1, column, 'min');
      initialize_ListPlot_ColorPicker(`${column}_ColorPicker_middle`, "#FFFFFF", column, 'middle');
      $(`#${column}_ColorPicker_middle`).spectrum("disable"); // ← disables mid picker
      initialize_ListPlot_ColorPicker(`${column}_ColorPicker_max`, Data_styling[column].Data_color2, column, 'max');

      // Initial visibility logic
      const minContainer = document.getElementById(`${column}_ColorPicker_min`).parentElement;
      const midContainer = document.getElementById(`${column}_ColorPicker_middle`).parentElement;
      const maxContainer = document.getElementById(`${column}_ColorPicker_max`).parentElement;

      if (currentStyle === "One") {
        minContainer.style.visibility = "hidden";
        midContainer.style.visibility = "hidden";
        maxContainer.style.visibility = "visible";
      } else if (currentStyle === "Two") {
        minContainer.style.visibility = "visible";
        midContainer.style.visibility = "hidden";
        maxContainer.style.visibility = "visible";
      } else {
        // Three_RWB or Three_TWM
        minContainer.style.visibility = "visible";
        midContainer.style.visibility = "visible";
        maxContainer.style.visibility = "visible";
      }
    }
  });

  // Apply enhanced dropdowns after the DOM is built
  enhanceListPlotDropdownsWithSelect2(activeColumns);

  // Apply all current dropdown selections as presets and trigger one render
  applyInitialColorPresetsAndRender(activeColumns);
}

function applyInitialColorPresetsAndRender(activeColumns) {
  const colorPresets = {
    One: { setup: "One", colorStart: "#ffffff", colorAvg: "#ffffff", colorEnd: "#707070" },
    Two: { setup: "Two", colorStart: "#97a6c4", colorAvg: "#ffffff", colorEnd: "#384860" },
    Three_RWB: { setup: "Three", colorStart: "#a00000", colorAvg: "#ffffff", colorEnd: "#1a80bb" },
    Three_TWM: { setup: "Three", colorStart: "#298c8c", colorAvg: "#ffffff", colorEnd: "#800074" }
  };

  activeColumns.forEach(column => {
    const styleDropdown = document.getElementById(`${column}_Style`);
    const selectedValue = styleDropdown?.value;
    const preset = colorPresets[selectedValue];
    if (!preset) return;

    // Store into Data_styling object
    Data_styling[column].Data_color1 = preset.colorStart;
    Data_styling[column].Data_color2 = preset.colorEnd;
    Data_styling[column].data_color_complexity = preset.setup;

    // DOM containers
    const minContainer = document.getElementById(`${column}_ColorPicker_min`).parentElement;
    const midContainer = document.getElementById(`${column}_ColorPicker_middle`).parentElement;
    const maxContainer = document.getElementById(`${column}_ColorPicker_max`).parentElement;

    // Set visibility
    minContainer.style.visibility = preset.setup !== 'One' ? 'visible' : 'hidden';
    midContainer.style.visibility = preset.setup === 'Three' ? 'visible' : 'hidden';
    maxContainer.style.visibility = 'visible';

    // Set spectrum values
    $(`#${column}_ColorPicker_min`).spectrum("set", preset.colorStart);
    $(`#${column}_ColorPicker_max`).spectrum("set", preset.colorEnd);
  });

  // 🔁 Final update after all presets are applied
  updateVisualization_list();
}


// Function to initialize Spectrum color pickers for list plot
function initialize_ListPlot_ColorPicker(elementId, start_color, column, type) {
  $("#" + elementId).spectrum({
      color: start_color,
      showPalette: true,
      showInput: true,
      preferredFormat: "hex",
      palette: [
      ["#000", "#FF0000", "#00FF00", "#0000FF", "#FFFF00"],
      ["#FF00FF", "#00FFFF", "#FFFFFF", "#C0C0C0", "#808080"],
      ["#800000", "#808000", "#008000", "#800080", "#008080"],
      ["#000080"]
      ],
      change: function(color) {
      // Store the color in Data_styling for this column and type
      if (type === 'min') {
          Data_styling[column].Data_color1 = color.toHexString();
      } else if (type === 'max') {
          Data_styling[column].Data_color2 = color.toHexString();
      }
      updateVisualization_list();  // Call function to update the visualization
      },
      move: function(color) {
      // Store the color in Data_styling for this column and type
      if (type === 'min') {
          Data_styling[column].Data_color1 = color.toHexString();
      } else if (type === 'max') {
          Data_styling[column].Data_color2 = color.toHexString();
      }
      updateVisualization_list();  // Call function to update the visualization
      }
  });
}

// Call this function to populate options for continuous data columns
document.addEventListener("DOMContentLoaded", function () {
  populateLegendLabelInputs("legendLabelContainer");
  populateLegendColorInputs("colorStylingContainer");
});

document.addEventListener('DOMContentLoaded', function () {
  const downloadBtn = document.querySelector('#DownloadDropdownToggle');
  const downloadMenu = downloadBtn?.nextElementSibling;

  if (downloadBtn && downloadMenu) {
    downloadBtn.addEventListener('click', function (e) {
      e.stopPropagation(); // prevent bubbling
      downloadMenu.style.display = (downloadMenu.style.display === 'block') ? 'none' : 'block';
    });

    // Close it when clicking anywhere else
    document.addEventListener('click', function () {
      downloadMenu.style.display = 'none';
    });

    // Prevent menu itself from closing if clicked inside
    downloadMenu.addEventListener('click', function (e) {
      e.stopPropagation();
    });
  }
});

// ###################
// ## Label switch ###
// ###################

document.addEventListener('DOMContentLoaded', function () {
  const labelButtons = document.querySelectorAll('.receptor-label-btn');

  // Optional: define default on load
  const defaultType = 'Protein';
  window.Label_names = window.Label_names || defaultType;

  labelButtons.forEach(btn => {
    // Highlight the active one on page load
    if (btn.getAttribute('data-value') === Label_names) {
      btn.classList.remove('btn-outline-primary');
      btn.classList.add('btn-primary');
    }

    btn.addEventListener('click', function () {
      const selectedValue = this.getAttribute('data-value');
      Label_names = selectedValue;
      updateVisualization_list();

      // Reset button styles
      labelButtons.forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-outline-primary');
      });
      this.classList.remove('btn-outline-primary');
      this.classList.add('btn-primary');
    });
  });
});
</script>
