{% extends "home/base.html" %}
{% load static %}
{% load humanize %}
{% block addon_css %}
<link rel="stylesheet" href="{% static 'home/css/nv.d3.min.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/nvd3-update.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/Spectrum_1_8_1.css' %}" type="text/css" />
<link rel="stylesheet" href="{% static 'home/css/select2_4.1.0-rc.0._full.css' %}" type="text/css">
{% endblock %}

{% block content %}
<div style="padding-top: 10px; font-size: 11px; white-space: nowrap;">
   <div class="col-md-12" style="margin-bottom: 20px;">
  <div style="display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap;">

    <!-- Receptor names dropdown -->
    <div class="dropdown" style="position: relative;">
      <button class="btn btn-primary dropdown-toggle" type="button" id="GPCRome_LabelType_Button"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        Receptor names
      </button>
      <div class="dropdown-menu p-2"
           style="min-width: 160px; padding: 10px 15px; left: 100%; top: 50%; margin-left: 5px; position: absolute; transform: translateY(-30%);">
        <button type="button" class="btn btn-outline-primary btn-block mb-1 GPCRome-label-btn" data-value="Protein">Protein</button>
        <button type="button" class="btn btn-outline-primary btn-block mb-1 GPCRome-label-btn" data-value="Entrez">Gene</button>
        <button type="button" class="btn btn-outline-primary btn-block GPCRome-label-btn" data-value="Uniprot">UniProt</button>
      </div>
    </div>

     <!-- Color styling dropdown -->
    <div class="dropdown" style="position: relative;">
      <button class="btn btn-primary dropdown-toggle" type="button" id="GPCRome_Color_Styling_Menu"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        Colors
      </button>
      <div class="dropdown-menu dropdown-menu-listplot"
          aria-labelledby="GPCRome_Color_Styling_Menu"
          style="min-width: 420px; padding: 10px 15px; left: 100%; top: 50%; margin-left: 5px; position: absolute; transform: translateY(-40%);">

        <!-- Color complexity -->
        <div class="col-md-12" style="margin: 15px 0px;">
          <div class="row">

            <!-- Dropdown column -->
            <div class="col-md-5 text-center">
              <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px;">
                Number of colors
              </label>
              <div style="width: 100%; margin: -3px auto;">
                <select id="GPCRome_color_styling" class="form-control" style="width: 130px;">
                  <option value="One">One</option>
                  <option value="Two">Two</option>
                  <option value="Three_RWB">Three</option>
                  <option value="Three_TWM">Three</option>
                </select>
              </div>
            </div>

            <!-- Color pickers column -->
            <div class="col-md-7">
              <!-- Label row -->
              <div style="display: flex; gap: 5px; justify-content: start; margin-bottom: 3px; font-size: 12px;">
                <div id="GPCRome_Color_min_label" style="width: 80px; text-align: center;">Min</div>
                <div id="GPCRome_Color_avg_label" style="width: 80px; text-align: center;">Mid</div>
                <div style="width: 80px; text-align: center;">Max</div>
              </div>
              <!-- Input row -->
              <div style="display: flex; gap: 5px; align-items: center;">
                <div id="GPCRome_Color_min_container" style="width: 80px; display: flex; justify-content: center;">
                  <input type="text" id="GPCRome_colorPicker_min" />
                </div>
                <div id="GPCRome_Color_avg_container" style="width: 80px; display: flex; justify-content: center;">
                  <input type="text" id="GPCRome_colorPicker_avg" />
                </div>
                <div id="GPCRome_Color_max_container" style="width: 80px; display: flex; justify-content: center;">
                  <input type="text" id="GPCRome_colorPicker_max" />
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Graphical legend dropdown -->
    <div class="dropdown" style="position: relative;">
      <button class="btn btn-primary dropdown-toggle" type="button" id="GraphicalLegend_Button"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        Graphical legend
      </button>
      <div class="dropdown-menu p-2"
           style="min-width: 160px; padding: 10px 15px; left: 100%; top: 50%; margin-left: 5px; position: absolute; transform: translateY(-25%);">
        <button type="button" class="btn btn-outline-primary btn-block mb-1 graphical-legend-option" data-icon="false" data-legend="false">None</button>
        <button type="button" class="btn btn-outline-primary btn-block mb-1 graphical-legend-option" data-icon="true" data-legend="false">Left</button>
        <button type="button" class="btn btn-outline-primary btn-block mb-1 graphical-legend-option" data-icon="false" data-legend="true">Right</button>
        <button type="button" class="btn btn-outline-primary btn-block graphical-legend-option" data-icon="true" data-legend="true">Both</button>
      </div>
    </div>

    <!-- Download dropdown -->
    <div class="dropdown" style="position: relative;">
      <button type="button" class="btn btn-primary dropdown-toggle"
            id="DownloadDropdownToggle" style="font-size: 14px;">
        <span class="glyphicon glyphicon-download" style="vertical-align: top; line-height: 1.3;"></span>
        Download <span class="caret"></span>
      </button>

      <div class="dropdown-menu"
          style="min-width: 160px; padding: 10px 15px; left: 100%; top: 50%;
                  margin-left: 5px; position: absolute; transform: translateY(-25%); display: none;">
        <button type="button" class="btn btn-primary btn-block"
                onclick="saveSvgAsJpg(document.getElementById('GPCRome_plot_svg'), 'GPCRome_plot.jpg');">
          JPG
        </button>
         <button type="button" class="btn btn-primary btn-block"
                onclick="saveSvgAsPng(document.getElementById('GPCRome_plot_svg'), 'GPCRome_plot.png');">
          PNG
        </button>
        <button type="button" class="btn btn-primary btn-block"
                onclick="saveSvg(document.getElementById('GPCRome_plot_svg'), 'GPCRome_plot.svg');">
          SVG
        </button>
        <button type="button" class="btn btn-primary btn-block"
                onclick="saveSvgAsTiff(document.getElementById('GPCRome_plot_svg'), 'GPCRome_plot.tiff');">
          TIFF
        </button>
      </div>
    </div>
    <div>
      <a href="/mapper/DataMapperHomeNumeric" class="btn btn-primary" style="display: inline-flex; align-items: center;">
        <span style="line-height: 1; margin-right: 6px; vertical-align: middle;">&#8592;</span>
        <span style="vertical-align: middle;">Return to plot selection</span>
      </a>
    </div>
  </div>
</div>

<div id="image-container" data-image-url="{% static 'home/images/DataMapper/DataMapper_GPCRome_icon_legend.png' %}"></div>
  <div class="col-md-12" style="margin-top: 0px;margin-bottom: 30px;">
      <div id="GPCRome_plot" class="text-center"></div>
  </div>
</div>
{% endblock %}

{% block addon_js %}
<script src="{% static 'home/js/d3.min.js' %}"></script>
<script src="{% static 'home/js/nv.d3.min.js' %}"></script>
<script src="{% static 'home/js/d3.v4.min.js' %}"></script>
<script src="{% static 'home/js/saveSvgAsPng.js' %}"></script>
<script src="{% static 'home/js/saveSvg.js' %}"></script>
<script src="{% static 'home/js/datamapper.js' %}"></script>
<script src="{% static 'home/js/spectrum_v1_8_1.js' %}"></script>
<script src="{% static 'home/js/select2_4.1.0-rc.0_full.js' %}"></script>

<!-- Universal scripts -->
<script>
$('.dropdown-menu').on('click', function(event){
    event.stopPropagation();
});

</script>
<script>

// Load the data
var GPCRome_WheelDict = {{ GPCRomeData|safe }};
var PlotType = "{{ PlotType }}";

if (PlotType === 'Numeric') {
  // Extract min and max data (for numeric version)
  const GPCRomeWheelValues = extractDataValues(GPCRome_WheelDict)
      .filter(value => value !== null && value !== '');

  const GPCRomeMin = GPCRomeWheelValues.length > 0 ? Math.min(...GPCRomeWheelValues) : null;
  const GPCRomeMax = GPCRomeWheelValues.length > 0 ? Math.max(...GPCRomeWheelValues) : null;
  const GPCRomeAvg = GPCRomeWheelValues.length > 0 ? (GPCRomeMin + GPCRomeMax) / 2 : null;

  function determineDecimalPlaces(minValue, maxValue) {
    const allValues = [minValue, maxValue];
    let maxDecimals = 0;

    allValues.forEach(value => {
        if (value == null) return; // Ignore nulls

        const valueStr = Math.abs(value).toString();

        if (valueStr.includes('e')) {
            // Handle scientific notation separately
            const parts = valueStr.split('e-');
            if (parts.length === 2) {
                const exp = parseInt(parts[1], 10);
                maxDecimals = Math.max(maxDecimals, exp);
            }
        } else if (valueStr.includes('.')) {
            const decimals = valueStr.split('.')[1].length;
            maxDecimals = Math.max(maxDecimals, decimals);
        }
    });

    // Cap at maximum 6 digits
    return Math.min(maxDecimals, 6);
  }

  var GPCRomes_styling = {
      GPCRomeMin: GPCRomeMin,
      GPCRomeMax: GPCRomeMax,
      GPCRomeAvg: GPCRomeAvg,
      LegendbarDigit: determineDecimalPlaces(GPCRomeMin,GPCRomeMax),
      LegendbarLength: 200,
      LegendbarFontsize: "11px",
      FontStyle: "Arial",
      FontsizeGlobal: "11px",
      FontsizeClass: "20px",
      DataType: "Numeric",
      colorStart: "#e64b35",
      colorAvg: "#FFFFFF",
      colorEnd: "#3c5488",
      ColorSetup: 'One',
      showIcon: true,
      LabelType: "Protein",
      ShowLegend: true,
      LegendLayout: { "mode": "row", "columns": "1" }
  };

  let GPCRome_location = "GPCRome_plot";
  DrawGPCRomeWheel(GPCRome_WheelDict, GPCRome_location, GPCRomes_styling);
  UpdateGPCRomeColorPickers();

  // Recursively extract all "Data" values from a nested object
  function extractDataValues(obj) {
      let values = [];

      function findData(node) {
          if (typeof node === "object" && node !== null) {
              for (const key in node) {
                  const value = node[key];

                  if (value && typeof value === "object" && "Data" in value) {
                      const dataValue = Number(value.Data);
                      if (!isNaN(dataValue)) {
                          values.push(dataValue);
                      }
                  } else {
                      findData(value); // keep digging
                  }
              }
          }
      }
      findData(obj);
      return values;
  }

  function updateGPCRome() {
      // Remove current
      d3.select("#" + GPCRome_location).select("svg").remove();
      // Redraw the GPCRome wheel plot
      DrawGPCRomeWheel(GPCRome_WheelDict, GPCRome_location, GPCRomes_styling); // ← Use the updated copy
  }

  // Attach click handler to dropdown items for receptor names
  document.addEventListener('DOMContentLoaded', function () {
    const labelButton = document.getElementById('GPCRome_LabelType_Button');
    const labelButtons = document.querySelectorAll('.GPCRome-label-btn');

    // Set initial button label
    // labelButton.textContent = GPCRomes_styling.LabelType || 'Protein';

    labelButtons.forEach(btn => {
      // Highlight the active label on load
      if (btn.getAttribute('data-value') === GPCRomes_styling.LabelType) {
        btn.classList.remove('btn-outline-primary');
        btn.classList.add('btn-primary');
      }

      btn.addEventListener('click', function () {
        const selectedValue = this.getAttribute('data-value');

        // Update GPCRomes_styling
        GPCRomes_styling.LabelType = selectedValue;
        updateGPCRome();

        // Highlight selected button
        labelButtons.forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-outline-primary');
        });
        this.classList.remove('btn-outline-primary');
        this.classList.add('btn-primary');
      });
    });
  });

  document.addEventListener('DOMContentLoaded', function () {
    const graphicalLegendOptions = document.querySelectorAll('.graphical-legend-option');

    graphicalLegendOptions.forEach(btn => {
      const iconValue = btn.getAttribute('data-icon') === 'true';
      const legendValue = btn.getAttribute('data-legend') === 'true';

      // Highlight the current selected state on load
      if (iconValue === GPCRomes_styling.showIcon && legendValue === GPCRomes_styling.ShowLegend) {
        btn.classList.remove('btn-outline-primary');
        btn.classList.add('btn-primary');
      }

      btn.addEventListener('click', function () {
        // Update styling
        GPCRomes_styling.showIcon = iconValue;
        GPCRomes_styling.ShowLegend = legendValue;

        // Redraw the plot
        updateGPCRome();

        // Update button highlight state
        graphicalLegendOptions.forEach(b => {
          b.classList.remove('btn-primary');
          b.classList.add('btn-outline-primary');
        });
        this.classList.remove('btn-outline-primary');
        this.classList.add('btn-primary');
      });
    });
  });

  document.addEventListener('DOMContentLoaded', function () {
    const downloadBtn = document.querySelector('#DownloadDropdownToggle');
    const downloadMenu = downloadBtn?.nextElementSibling;

    if (downloadBtn && downloadMenu) {
      downloadBtn.addEventListener('click', function (e) {
        e.stopPropagation(); // prevent bubbling
        downloadMenu.style.display = (downloadMenu.style.display === 'block') ? 'none' : 'block';
      });

      // Close it when clicking anywhere else
      document.addEventListener('click', function () {
        downloadMenu.style.display = 'none';
      });

      // Prevent menu itself from closing if clicked inside
      downloadMenu.addEventListener('click', function (e) {
        e.stopPropagation();
      });
    }
  });

  // ###################
  // ## Color styling ##
  // ###################
  function UpdateGPCRomeColorPickers() {
    const selectedValue = $('#GPCRome_color_styling').val();

    const colorPresets = {
      "One": {
        setup: "One",
        colorStart: "#ffffff",
        colorAvg: "#ffffff",
        colorEnd: "#707070"
      },
      "Two": {
        setup: "Two",
        colorStart: "#97a6c4",
        colorAvg: "#ffffff",
        colorEnd: "#384860"
      },
      "Three_RWB": {
        setup: "Three",
        colorStart: "#a00000",
        colorAvg: "#ffffff",
        colorEnd: "#1a80bb"
      },
      "Three_TWM": {
        setup: "Three",
        colorStart: "#298c8c",
        colorAvg: "#ffffff",
        colorEnd: "#800074"
      }
    };

    const preset = colorPresets[selectedValue];

    if (preset) {
      GPCRomes_styling.ColorSetup = preset.setup;
      GPCRomes_styling.colorStart = preset.colorStart;
      GPCRomes_styling.colorAvg = preset.colorAvg;
      GPCRomes_styling.colorEnd = preset.colorEnd;

      $("#GPCRome_colorPicker_min").spectrum("set", preset.colorStart);
      $("#GPCRome_colorPicker_avg").spectrum("set", preset.colorAvg);
      $("#GPCRome_colorPicker_max").spectrum("set", preset.colorEnd);
    }

    const showMin = GPCRomes_styling.ColorSetup !== 'One';
    const showAvg = GPCRomes_styling.ColorSetup === 'Three';

    document.getElementById("GPCRome_Color_min_container").style.visibility = showMin ? 'visible' : 'hidden';
    document.getElementById("GPCRome_Color_avg_container").style.visibility = showAvg ? 'visible' : 'hidden';
    document.getElementById("GPCRome_Color_max_container").style.visibility = 'visible';

    document.getElementById("GPCRome_Color_min_label").style.visibility = showMin ? 'visible' : 'hidden';
    document.getElementById("GPCRome_Color_avg_label").style.visibility = showAvg ? 'visible' : 'hidden';

    updateGPCRome();
  }

  function updateGPCRomeVisualization() {
    const colorMin = $("#GPCRome_colorPicker_min").spectrum("get").toHexString();
    const colorAvg = $("#GPCRome_colorPicker_avg").spectrum("get").toHexString();
    const colorMax = $("#GPCRome_colorPicker_max").spectrum("get").toHexString();

    GPCRomes_styling.colorStart = colorMin;
    GPCRomes_styling.colorAvg = colorAvg;
    GPCRomes_styling.colorEnd = colorMax;

    // Dynamically update the plot
    updateGPCRome();
  }

  // Initialize all color pickers for GPCRomeWheel
  $(document).ready(function() {
    function initializeGPCRomeColorPicker(elementId, start_color) {
      $("#" + elementId).spectrum({
        color: start_color,
        showPalette: true,
        showInput: true,
        preferredFormat: "hex",
        palette: [
          ["#000", "#FF0000", "#00FF00", "#0000FF", "#FFFF00"],
          ["#FF00FF", "#00FFFF", "#FFFFFF", "#C0C0C0", "#808080"],
          ["#800000", "#808000", "#008000", "#800080", "#008080"],
          ["#000080"]
        ],
        change: function(color) {
          updateGPCRomeVisualization();
        },
        move: function(color) {
          updateGPCRomeVisualization();
        }
      });
    }

    // Initialize color pickers
    initializeGPCRomeColorPicker("GPCRome_colorPicker_min", GPCRomes_styling.colorStart);
    initializeGPCRomeColorPicker("GPCRome_colorPicker_avg", GPCRomes_styling.colorAvg);
    $("#GPCRome_colorPicker_avg").spectrum("disable");
    initializeGPCRomeColorPicker("GPCRome_colorPicker_max", GPCRomes_styling.colorEnd);
  });

  $(document).ready(function () {
    function formatColorScheme(option) {
      if (!option.id) return option.text;

      const colorSlots = {
        "One": [null, null, "#707070"], // Only Max
        "Two": ["#97a6c4", null, "#384860"], // Min, (empty), Max
        "Three_RWB": ["#a00000", "#ffffff", "#1a80bb"],
        "Three_TWM": ["#298c8c", "#ffffff", "#800074"]
      };

      const colors = colorSlots[option.id];
      if (colors) {
        const $option = $(`
          <span style="display:flex; align-items:center;">
            <span style="min-width: 50px; display:inline-block;text-align: center; padding-right: 5px;">${option.text}</span>
            ${colors.map(color => {
              const bg = color || 'transparent';
              const opacity = color ? '' : 'opacity:0;';
              return `<span style="display:inline-block;width:14px;height:14px;margin-left:5px;border:1px solid #ccc;border-radius:2px;background:${bg};${opacity}"></span>`;
            }).join('')}
          </span>
        `);
        return $option;
      }

      return option.text;
    }

    $('#GPCRome_color_styling').select2({
      templateResult: formatColorScheme,
      templateSelection: formatColorScheme,
      width: 'resolve'
    });

    // Attach change handler after initializing Select2
    $('#GPCRome_color_styling').on('change', function () {
      UpdateGPCRomeColorPickers();
    });
  });
}
</script>
{% endblock %}
